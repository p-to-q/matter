name: vercel-build-replay

# Vercel commit statuses show failure for every main deployment since 2026-10-25
# and expose no error text; the deployment account is inaccessible from here.
# The plain `vercel build` CLI refuses to run without pulled project settings,
# so scripts/replay-vercel-build.mjs drives the official @vercel/next builder
# directly: same builders, vercel.json buildCommand, no credentials, no upload,
# no deployment. The failure then becomes diagnosable from these logs.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @vercel/next@latest @vercel/build-utils@latest
      - run: node scripts/replay-vercel-build.mjs
