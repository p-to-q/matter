name: vercel-build-replay

# Vercel commit statuses show failure for every main deployment since PR #136
# and expose no error text; the deployment account is inaccessible from here.
# `vercel build` runs the same hosted builders and the vercel.json buildCommand
# on this runner without credentials, upload, or deployment, so the production
# build failure becomes diagnosable from these logs.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes vercel@latest build
