<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Matter">
  <!--
    Provisional mark, not the final product icon.

    One thought, rooted, with lineage hanging off it — the same figure the left
    material index draws, so the tab and the app say the same thing. Drawn on a
    32-unit grid because a favicon is read at 16 px: strokes are 2.6 and nodes
    are r2.7, which survive that halving; the previous 3-on-64 strokes did not.
    Ink and paper only. The product has no third colour, so neither does this.
  -->
  <style>
    .tile { fill: #161d27; }
    .mark { stroke: #f5f5f2; fill: #f5f5f2; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f2; }
      .mark { stroke: #161d27; fill: #161d27; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5"/>
  <g class="mark" fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M10 11.2v13.3M10 16.5h9.6M10 24.5h9.6"/>
    <circle cx="10" cy="8.5" r="2.7" stroke="none"/>
    <circle cx="22.4" cy="16.5" r="2.7" stroke="none"/>
    <circle cx="22.4" cy="24.5" r="2.7" stroke="none"/>
  </g>
</svg>
